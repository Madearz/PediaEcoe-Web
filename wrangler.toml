workers_dev = true

[vars]
FIREBASE_PROJECT_ID = "pediaecoe-ai"
ALLOWED_ORIGINS = "https://madearz.github.io"
AI_ENABLED = "true"
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "LIMITS"
